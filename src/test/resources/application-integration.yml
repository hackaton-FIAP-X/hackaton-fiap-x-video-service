spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        auto-startup: true
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 2
          initial-interval: 200ms

video:
  cache:
    enabled: true
    ttl: 60s
  outbox:
    scheduler:
      enabled: false

logging:
  level:
    root: WARN
    br.com.fiap.hackaton.video: INFO
