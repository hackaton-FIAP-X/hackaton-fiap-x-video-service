spring:
  application:
    name: video-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fiapx_video}
    username: ${DB_USER:fiapx}
    password: ${DB_PASSWORD:fiapx}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:fiapx}
    password: ${RABBITMQ_PASSWORD:fiapx}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: ${STATUS_CONSUMER_PREFETCH:10}
        concurrency: ${STATUS_CONSUMER_CONCURRENCY:2}
        max-concurrency: ${STATUS_CONSUMER_MAX_CONCURRENCY:5}
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:500MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:512MB}
      file-size-threshold: ${UPLOAD_MEMORY_THRESHOLD:1MB}

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:fiapx}
  secret-key: ${STORAGE_SECRET_KEY:fiapx12345}
  bucket: ${STORAGE_BUCKET:fiapx}
  region: ${STORAGE_REGION:us-east-1}

video:
  upload:
    max-size: ${UPLOAD_MAX_FILE_SIZE:500MB}
  download:
    url-ttl: ${DOWNLOAD_URL_TTL:5m}
  cache:
    enabled: ${CACHE_ENABLED:true}
    ttl: ${CACHE_TTL:60s}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
    scheduler:
      enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
      interval-ms: ${OUTBOX_SCHEDULER_INTERVAL_MS:5000}
      initial-delay-ms: ${OUTBOX_SCHEDULER_INITIAL_DELAY_MS:10000}

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:fiapx-auth}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    br.com.fiap.hackaton.video: ${LOG_LEVEL:INFO}
