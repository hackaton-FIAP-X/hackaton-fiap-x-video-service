spring:
  application:
    name: video-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fiapx_video}
    username: ${DB_USER:fiapx}
    password: ${DB_PASSWORD:fiapx}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:500MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:512MB}
      file-size-threshold: ${UPLOAD_MEMORY_THRESHOLD:1MB}

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:fiapx}
  secret-key: ${STORAGE_SECRET_KEY:fiapx12345}
  bucket: ${STORAGE_BUCKET:fiapx}
  region: ${STORAGE_REGION:us-east-1}

video:
  upload:
    max-size: ${UPLOAD_MAX_FILE_SIZE:500MB}

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:fiapx-auth}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    br.com.fiap.hackaton.video: ${LOG_LEVEL:INFO}
